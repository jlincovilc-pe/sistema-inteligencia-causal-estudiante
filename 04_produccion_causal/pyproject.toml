[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalops-course-production"
version = "0.1.0"
description = "Producción local y auditable para sistemas de inteligencia causal"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.2",
  "scipy==1.17.0",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "jsonschema==4.26.0",
  "pydantic==2.12.4",
]

[project.optional-dependencies]
service = ["fastapi==0.135.3", "uvicorn==0.44.0", "joblib==1.5.3"]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
containers = ["mlflow>=3.0", "dvc>=3.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "B1_servicio_dml", "B3_servicio_policy", "B4_monitoreo_causal"]
testpaths = ["tests", "B1_servicio_dml/tests", "B3_servicio_policy/tests", "B4_monitoreo_causal/tests"]
